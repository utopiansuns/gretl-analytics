name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Тесты (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Установка
        run: pip install -e ".[dev]"
      - name: Проверка кода
        run: python -m pyflakes src tests packaging scripts
      - name: Тесты
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
