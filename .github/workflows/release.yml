name: Release

# Сборка приложений для Windows, macOS (Apple Silicon и Intel) и Linux.
# Запуск: вручную (Actions → Release → Run workflow) или тегом вида v1.0.0 (тогда создаётся релиз).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Сборка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Системные библиотеки окна (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - name: Установка
        run: pip install -e ".[dev,build]"
      - name: Тесты
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
      - name: Сборка
        run: python packaging/build.py
        env:
          PYTHONIOENCODING: utf-8
      - uses: actions/upload-artifact@v4
        with:
          name: gretl-analytics-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
