name: Release

# Сборка приложений для Windows, macOS (Apple Silicon и Intel) и Linux.
# Запуск: вручную (Actions → Release → Run workflow) или тегом вида v1.0.0 (тогда создаётся релиз).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Сборка (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Системные библиотеки окна (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6
      - name: Установка
        run: pip install -e ".[dev,build]"
      - name: Тесты
        run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
      - name: Сборка
        run: python packaging/build.py
        env:
          PYTHONIOENCODING: utf-8
      # Как у пользователя: архив скачан из Интернета, и Windows пометила каждый файл (Zone.Identifier).
      # Сначала без снятия пометки (воспроизводит ошибку, на релиз не влияет), затем как в приложении.
      - name: Проверка запуска после скачивания (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive (Get-Item dist\*.zip).FullName -DestinationPath smoke
          Get-ChildItem smoke -Recurse -File | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $exe = "smoke\GretlAnalytics\GretlAnalytics.exe"
          function Check($label, $env_extra) {
            $env:GRETL_ANALYTICS_CHECK = "$PWD\check.json"
            foreach ($k in $env_extra.Keys) { Set-Item "env:$k" $env_extra[$k] }
            $p = Start-Process $exe -Wait -PassThru
            foreach ($k in $env_extra.Keys) { Remove-Item "env:$k" }
            Write-Host "$label (код $($p.ExitCode)): $(Get-Content check.json -Raw)"
            return $p.ExitCode
          }
          Check "Без снятия пометки" @{ GRETL_ANALYTICS_NO_UNBLOCK = "1" } | Out-Null
          if ((Check "Как в приложении" @{}) -ne 0) { Write-Error "Окно не загрузится у пользователя"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: gretl-analytics-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
